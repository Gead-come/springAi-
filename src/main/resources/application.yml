server:
  port: 8099  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  application:
    name: my-spring-ai
  ai:
    dashscope:
      api-key: sk-fe2c14d6d42149d991dd4cdfdf03d605
      chat:
        options:
          model: qwen-plus
    openai: #openai配置
      base-url: https://dashscope.aliyuncs.com/compatible-mode #阿里百炼api地址
      #      base-url: https://api.chatanywhere.tech #api地址
      api-key: ${ALIYUN_API_KEY} #读取环境变量中的阿里百炼 api key
      #      api-key: ${OPENAI_API_KEY} #读取环境变量中的api key
      chat:
        options:
          model: qwen-plus #阿里百炼 模型名称
        enabled: false #关闭OpenAI配置
#          model: gpt-3.5-turbo #模型名称
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
